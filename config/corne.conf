# ── Batería ──
# Intervalo de reporte de batería en segundos
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ── Debounce ──
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ── Bluetooth ──
# Aumenta la potencia BT para mejor comunicación entre mitades
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Nombre del teclado
CONFIG_ZMK_KEYBOARD_NAME="Corne"
# Fix para error de batería en Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ── Display (nice!view) ──
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ── Sleep / Power management ──
# CAMBIO: idle timeout aumentado a 30 minutos (era 10)
CONFIG_ZMK_IDLE_TIMEOUT=1800000
# CAMBIO: deep sleep DESACTIVADO - el lado derecho sin batería
# no puede recuperarse del deep sleep correctamente
CONFIG_ZMK_SLEEP=n
# Si en el futuro ponés batería en el derecho, podés reactivar:
# CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── ZMK Studio ──
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ── RGB / LEDs ──
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
# Apaga RGB cuando el teclado entra en idle
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=80
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
